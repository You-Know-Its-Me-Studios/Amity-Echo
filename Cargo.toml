[package]
name = "amity-echo"
version = "0.1.8"
edition = "2024"
description = "Amity Echo, the first-party terminal coding agent for Amity"

[[bin]]
name = "echocli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ctrlc = "3.4"
rustyline = "17.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self-replace = "1.5.1"
sha2 = "0.10"
tempfile = "3.0"
ureq = "3.5.1"
