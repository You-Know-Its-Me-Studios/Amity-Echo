[package]
name = "amity-echo"
version = "0.1.0"
edition = "2024"
description = "Amity Echo, the first-party terminal coding agent for Amity"

[[bin]]
name = "echocli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ctrlc = "3.4"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
