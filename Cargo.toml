[package]
name = "amity-echo"
version = "0.3.7"
edition = "2024"
description = "Amity Echo, the first-party terminal coding agent for Amity"

[[bin]]
name = "echocli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
ctrlc = "3.4"
getrandom = "0.4"
rustyline = "17.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self-replace = "1.5.1"
sha2 = "0.10"
tempfile = "3.0"
ureq = "3.5.1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials"] }
